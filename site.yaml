    activa: true
    antetitulo: La casa
    titulo: Por qué abrimos este estudio
    declaracion: "Aquí no hay catálogo en la pared ni prisas en la silla. Cada pieza se dibuja para una sola piel y cada corte se termina a navaja."
    autor: Antía Lago, fundadora del estudio

  preguntas:
    activa: true
    antetitulo: Cuidados y dudas
    titulo: Lo que nos preguntáis antes y después
    texto: "Si tu duda no está aquí, escríbenos por WhatsApp."
    imagen: /fotos/cuidados.jpg
    preguntas:
      - { pregunta: "¿Cuánto tarda en curar un tatuaje?", respuesta: "Entre dos y cuatro semanas, según la zona y el tamaño. La primera semana pica y se pela un poco: es normal." }
      - { pregunta: "¿Qué hago los primeros días?", respuesta: "Lávalo con jabón neutro dos o tres veces al día, sécalo a toquecitos y pon una capa fina de crema. Ni sol, ni piscina, ni mar durante tres semanas." }
      - { pregunta: "¿Duele mucho?", respuesta: "Depende de la zona: costillas, pies y codos molestan más; brazo y gemelo, bastante menos. Paramos cuando lo necesites." }
      - { pregunta: "¿Hay que dejar señal para reservar?", respuesta: "Para tatuajes sí, y se descuenta del precio final. Barbería y piercing no llevan señal." }
      - { pregunta: "¿Tatuáis a menores?", respuesta: "No tatuamos a menores de 18 años. El piercing de oreja, a partir de 16 y con la madre, el padre o el tutor presentes." }
      - { pregunta: "¿Puedo ir a la barbería sin cita?", respuesta: "Si hay hueco, sí. Para ir a tiro hecho, pide cita por WhatsApp: los sábados se llenan pronto." }

  cita:
    activa: true
    antetitulo: Pide cita
    titulo: Cuéntanos tu idea
    texto: "Te respondemos en dos días laborables con presupuesto y fecha. Para barbería, mejor por WhatsApp: es más rápido."
    nota: "Sin compromiso. La señal solo se pide al confirmar la fecha."
    boton_formulario: Enviar mi idea
    opciones: "Brazo; Antebrazo; Mano; Hombro; Espalda; Pecho; Costillas; Pierna; Gemelo; Tobillo; Cuello; Oreja; Otra zona"
    items:
